<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PushTV - 极速安装传送门</title>
    <style>
        :root {
            --primary: #38BDF8;
            --success: #10B981;
            --bg-start: #020617;
            --bg-end: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --glow-blue: linear-gradient(135deg, #38bdf8 0%, #1e293b 40%);
            --glow-purple: linear-gradient(135deg, #818cf8 0%, #1e293b 40%);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 模拟星空效果 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,0.2) 2px, transparent 40px);
            background-size: 100px 100px;
            opacity: 0.05;
            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 900px;
            padding: 40px 0;
        }

        header { text-align: center; margin-bottom: 50px; }
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #64748b; margin-top: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }

        .tabs-container { display: flex; justify-content: center; width: 100%; margin-bottom: 32px; }
        .tabs {
            display: inline-flex;
            padding: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .tab {
            padding: 8px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #94a3b8;
            font-weight: 600;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

        .section { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* 发光卡片设计 */
        .app-card, .drop-zone, .mirror-section, .search-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .search-container {
            margin-bottom: 32px;
            display: flex;
            gap: 12px;
            padding: 6px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .search-input {
            min-width: 0;
            border: none;
            background: transparent;
            color: white;
            font-size: 1rem;
            flex: 1 1 0;
            outline: none;
            padding: 12px;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 20px;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 600;
            flex: 0 0 auto;
        }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }
        .toggle-btn.active {
            border-color: var(--primary);
            color: white;
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* 边框发光特效 */
        .app-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(56,189,248,0.3) 0%, transparent 40%, transparent 60%, rgba(129,140,248,0.1) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .drop-zone {
            padding: 60px 20px;
            text-align: center;
            border-style: dashed;
            border-width: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .drop-zone:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
        }
        .drop-zone:hover,
        .drop-zone.dragover {
            background: rgba(34, 211, 238, 0.16);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12), inset 0 0 36px rgba(56, 189, 248, 0.08);
        }
        .drop-zone:hover .drop-icon,
        .drop-zone:hover .upload-hint,
        .drop-zone.dragover .drop-icon,
        .drop-zone.dragover .upload-hint {
            color: #67e8f9;
        }
        .drop-icon, .upload-hint { transition: color 0.2s ease; }
        .upload-hint { font-weight: 650; }

        .file-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .file-item {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(12px);
        }
        .file-item.is-complete { border-color: rgba(16, 185, 129, 0.38); }
        .file-item.is-error { border-color: rgba(248, 113, 113, 0.4); }
        .file-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
            font-size: 1.35rem;
        }
        .file-main { min-width: 0; }
        .file-heading {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 10px;
        }
        .file-name {
            min-width: 0;
            overflow: hidden;
            color: #f8fafc;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-status {
            flex: none;
            max-width: 45%;
            overflow: hidden;
            color: var(--primary);
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item.is-complete .file-status { color: #34d399; }
        .file-item.is-error .file-status { color: #f87171; }
        .progress-track {
            height: 5px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 3px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            width: 0%;
            transition: 0.3s;
            border-radius: 3px;
        }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .app-card { padding: 24px; transition: 0.3s; }
        .app-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.7); }

        .app-info { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .app-name { font-size: 1.1rem; font-weight: 700; color: white; }
        .app-pkg { font-size: 0.8rem; color: #64748b; font-family: monospace; }

        .url-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .save-btn {
            box-sizing: border-box;
            background: #f8fafc;
            color: #020617;
            font-weight: 700;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .save-btn:hover { background: var(--primary); color: white; }

        @media (max-width: 480px) {
            .search-container { gap: 6px; }
            .search-input {
                padding: 10px 8px;
                font-size: 0.9rem;
            }
            .toggle-btn {
                padding: 9px 12px;
                font-size: 0.82rem;
            }
        }

        footer { margin-top: 50px; padding: 40px; color: #475569; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PushTV</h1>
            <p class="subtitle">✓ 电视端极速工具箱</p>
        </header>

        <div class="tabs-container">
            <div class="tabs">
                <div class="tab active" onclick="showSection('upload', this)">文件传输</div>
                <div class="tab" onclick="showSection('apps', this)">更新管理</div>
            </div>
        </div>

        <div id="upload-section" class="section active">
            <div class="drop-zone" id="dropZone" role="button" tabindex="0">
                <span class="drop-icon" style="font-size: 40px; display: block; margin-bottom: 10px;">📦</span>
                <div class="upload-hint">拖拽/点击上传 APK 到这里</div>
                <input type="file" id="fileInput" accept=".apk" multiple style="display:none">
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div id="apps-section" class="section">
            <div class="search-container">
                <input type="text" id="appSearch" class="search-input" placeholder="搜索应用名称或包名..." oninput="filterApps()">
                <button id="systemToggle" class="toggle-btn active" onclick="toggleSystemApps()">隐藏系统应用</button>
            </div>
            <div class="app-grid" id="appGrid">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <footer>PushTV - 专注电视端极速体验</footer>

    <script>
        function showSection(id, clickedTab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id + '-section').classList.add('active');
            clickedTab.classList.add('active');
            if(id === 'apps') loadApps();
        }

        // 文件上传逻辑 (保持原样并增强)
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        };

        let dragDepth = 0;
        dropZone.ondragenter = (e) => {
            e.preventDefault();
            dragDepth += 1;
            dropZone.classList.add('dragover');
        };
        dropZone.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            dropZone.classList.add('dragover');
        };
        dropZone.ondragleave = (e) => {
            e.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) dropZone.classList.remove('dragover');
        };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dragDepth = 0;
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.name.toLowerCase().endsWith('.apk')) {
                    addUploadError(file.name, '仅支持 APK 文件');
                } else if (file.size === 0) {
                    addUploadError(file.name, '文件为空，无法上传');
                } else {
                    uploadFile(file);
                }
            });
            fileInput.value = '';
        }

        function createUploadItem(fileName, initialStatus) {
            const id = 'f-' + Math.random().toString(36).slice(2, 11);
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-icon" aria-hidden="true">⇧</div>
                <div class="file-main">
                    <div class="file-heading">
                        <span class="file-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
                        <span class="file-status" id="${id}-status">${escapeHtml(initialStatus)}</span>
                    </div>
                    <div class="progress-track">
                        <div id="${id}-bar" class="progress-bar"></div>
                    </div>
                </div>
            `;
            document.getElementById('fileList').prepend(item);
            return { id, item };
        }

        function addUploadError(fileName, message) {
            const upload = createUploadItem(fileName, message);
            upload.item.classList.add('is-error');
        }

        function uploadFile(file) {
            const { id, item } = createUploadItem(file.name, '准备中');
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');
            xhr.timeout = 10 * 60 * 1000;
            xhr.upload.onprogress = (e) => {
                const status = document.getElementById(id + '-status');
                if (e.lengthComputable && e.total > 0) {
                    const p = Math.min(100, Math.round((e.loaded / e.total) * 100));
                    document.getElementById(id + '-bar').style.width = p + '%';
                    status.innerText = p + '%';
                } else {
                    status.innerText = '上传中';
                }
            };
            xhr.onload = () => {
                const status = document.getElementById(id + '-status');
                let payload = {};
                try { payload = JSON.parse(xhr.responseText); } catch (_) {}
                if (xhr.status >= 200 && xhr.status < 300 && payload.success === true) {
                    status.innerText = '✓ 已送达';
                    item.classList.add('is-complete');
                } else {
                    status.innerText = payload.message || `上传失败 (${xhr.status})`;
                    item.classList.add('is-error');
                }
            };
            xhr.onerror = () => {
                document.getElementById(id + '-status').innerText = '网络连接失败';
                item.classList.add('is-error');
            };
            xhr.onabort = () => {
                document.getElementById(id + '-status').innerText = '上传已取消';
                item.classList.add('is-error');
            };
            xhr.ontimeout = () => {
                document.getElementById(id + '-status').innerText = '上传超时，请重试';
                item.classList.add('is-error');
            };
            const fd = new FormData(); fd.append('file', file);
            xhr.send(fd);
        }

        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = value;
            return node.innerHTML;
        }

        // 应用管理逻辑
        let allApps = [];
        let hideSystem = true;

        async function loadApps() {
            const grid = document.getElementById('appGrid');
            if (allApps.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center">正在读取电视上的 App 列表...</div>';
            }
            try {
                const res = await fetch('/api/apps');
                allApps = await res.json();
                filterApps(); // 初始渲染
            } catch(e) { grid.innerHTML = '加载失败，请检查连接'; }
        }

        function toggleSystemApps() {
            hideSystem = !hideSystem;
            const btn = document.getElementById('systemToggle');
            btn.classList.toggle('active', hideSystem);
            btn.innerText = hideSystem ? '隐藏系统应用' : '显示系统应用';
            filterApps();
        }

        function filterApps() {
            const query = document.getElementById('appSearch').value.toLowerCase();
            let filtered = allApps;

            if (hideSystem) {
                filtered = filtered.filter(app => !app.isSystem);
            }

            filtered = filtered.filter(app =>
                app.name.toLowerCase().includes(query) ||
                app.packageName.toLowerCase().includes(query)
            );
            renderApps(filtered);
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            if (apps.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: #64748B; margin-top: 20px;">未找到匹配的应用</div>';
                return;
            }
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-info">
                        <div class="app-name">${app.name}</div>
                        <div class="app-pkg">${app.packageName} (${app.version})</div>
                    </div>
                    <input type="text" class="url-input" id="url-${app.packageName}" value="${app.url || ''}" placeholder="GitHub 项目地址">
                    <button class="save-btn" onclick="saveUrl('${app.packageName}')">同步到电视</button>
                `;
                grid.appendChild(card);
            });
        }

        async function saveUrl(pkg) {
            const url = document.getElementById('url-' + pkg).value;
            const fd = new URLSearchParams();
            fd.append('packageName', pkg);
            fd.append('url', url);
            try {
                const res = await fetch('/api/save_url', { method: 'POST', body: fd });
                const payload = await res.json();
                if (res.ok && payload.success === true) {
                    alert('同步成功！现在可以在电视上点更新了。');
                } else {
                    alert(payload.message || `同步失败 (${res.status})`);
                }
            } catch (_) {
                alert('同步失败，请检查连接');
            }
        }
    </script>
</body>
</html>
