<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PushTV - 极速安装传送门</title>
    <style>
        :root {
            --primary: #38BDF8;
            --success: #10B981;
            --bg-start: #020617;
            --bg-end: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 900px;
            padding: 40px 0;
        }

        header { text-align: center; margin-bottom: 50px; }
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            color: #f8fafc;
        }
        .subtitle { color: #64748b; margin-top: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }

        .tabs-container { display: flex; justify-content: center; width: 100%; margin-bottom: 32px; }
        .tabs {
            display: inline-flex;
            padding: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .tab {
            padding: 8px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

        .section { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* 发光卡片设计 */
        .app-card, .drop-zone, .mirror-section, .search-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .search-container {
            margin-bottom: 32px;
            display: flex;
            gap: 12px;
            padding: 6px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .search-input {
            min-width: 0;
            border: none;
            background: transparent;
            color: white;
            font-size: 1rem;
            flex: 1 1 0;
            outline: none;
            padding: 12px;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 20px;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 600;
            flex: 0 0 auto;
        }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }
        .toggle-btn.active {
            border-color: var(--primary);
            color: white;
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .drop-zone {
            padding: 60px 20px;
            text-align: center;
            border-style: dashed;
            border-width: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .drop-zone:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
        }
        .drop-zone:hover,
        .drop-zone.dragover {
            background: rgba(34, 211, 238, 0.16);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12), inset 0 0 36px rgba(56, 189, 248, 0.08);
        }
        .drop-zone:hover .drop-icon,
        .drop-zone:hover .upload-hint,
        .drop-zone.dragover .drop-icon,
        .drop-zone.dragover .upload-hint {
            color: #67e8f9;
        }
        .drop-icon, .upload-hint { transition: color 0.2s ease; }
        .upload-hint { font-weight: 650; }

        .file-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .file-item {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(12px);
        }
        .file-item.is-complete { border-color: rgba(16, 185, 129, 0.38); }
        .file-item.is-error { border-color: rgba(248, 113, 113, 0.4); }
        .file-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
            font-size: 1.35rem;
        }
        .file-main { min-width: 0; }
        .file-heading {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 10px;
        }
        .file-name {
            min-width: 0;
            overflow: hidden;
            color: #f8fafc;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-status {
            flex: none;
            max-width: 45%;
            overflow: hidden;
            color: var(--primary);
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item.is-complete .file-status { color: #34d399; }
        .file-item.is-error .file-status { color: #f87171; }
        .progress-track {
            height: 5px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 3px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: 0.3s;
            border-radius: 3px;
        }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .app-card { padding: 24px; transition: 0.3s; }
        .app-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.7); }

        .app-info { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .app-name { font-size: 1.1rem; font-weight: 700; color: white; }
        .app-pkg { font-size: 0.8rem; color: #64748b; font-family: monospace; }

        .url-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .save-btn {
            box-sizing: border-box;
            background: #f8fafc;
            color: #020617;
            font-weight: 700;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .save-btn:hover { background: var(--primary); color: white; }

        .github-token-card {
            padding: 22px;
            margin-bottom: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
        }
        .github-token-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
            color: #f8fafc;
            font-size: 1.05rem;
            font-weight: 700;
        }
        .github-token-status {
            flex: none;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .github-token-status.configured { color: #34d399; }
        .github-token-help {
            margin: 0 0 16px;
            color: #94a3b8;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .github-token-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: center;
        }
        .github-token-row .url-input { margin-bottom: 0; }
        .github-token-row .btn { height: 42px; }

        @media (max-width: 480px) {
            .search-container { gap: 6px; }
            .search-input {
                padding: 10px 8px;
                font-size: 0.9rem;
            }
            .toggle-btn {
                padding: 9px 12px;
                font-size: 0.82rem;
            }
            .github-token-row {
                grid-template-columns: 1fr;
            }
            .github-token-row .btn {
                width: 100%;
            }
        }

        .webdav-card {
            padding: 24px;
            margin-bottom: 24px;
        }
        .webdav-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .webdav-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .badge-online { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-unconfigured { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .badge-online .badge-dot { background: #34d399; }
        .badge-offline .badge-dot { background: #f87171; }
        .badge-unconfigured .badge-dot { background: #94a3b8; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #f1f5f9; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .backup-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .app-item-select {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .app-item-select input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        @media (max-width: 640px) {
            .container {
                width: 92%;
                padding: 20px 0;
            }
            header {
                margin-bottom: 20px;
            }
            h1 {
                font-size: 2.4rem;
                letter-spacing: -1px;
            }
            .tabs-container {
                margin-bottom: 20px;
                width: 100%;
            }
            .tabs {
                display: flex;
                width: 100%;
                box-sizing: border-box;
                padding: 4px;
                gap: 4px;
                border-radius: 12px;
            }
            .tab {
                flex: 1 1 0;
                min-width: 0;
                padding: 10px 4px;
                border-radius: 9px;
                font-size: 0.88rem;
                text-align: center;
                white-space: nowrap;
            }
            .search-container {
                flex-direction: column;
                align-items: stretch;
                padding: 8px;
                gap: 8px;
            }
            .search-input {
                padding: 8px 6px;
                width: 100%;
                box-sizing: border-box;
            }
            .toggle-btn {
                justify-content: center;
                width: 100%;
                box-sizing: border-box;
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .app-grid {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn {
                width: 100%;
                text-align: center;
            }
            .backup-bar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
            .backup-bar .btn {
                width: 100%;
                text-align: center;
            }
        }

        footer { margin-top: 50px; padding: 40px; color: #475569; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PushTV</h1>
            <p class="subtitle">✓ 电视端极速工具箱</p>
        </header>

        <div class="tabs-container">
            <div class="tabs">
                <div class="tab active" onclick="showSection('upload', this)">文件传输</div>
                <div class="tab" onclick="showSection('apps', this)">更新管理</div>
                <div class="tab" onclick="showSection('webdav', this)">WebDAV</div>
            </div>
        </div>

        <div id="upload-section" class="section active">
            <div class="drop-zone" id="dropZone" role="button" tabindex="0">
                <span class="drop-icon" style="font-size: 40px; display: block; margin-bottom: 10px;">📦</span>
                <div class="upload-hint">拖拽/点击上传 APK 到这里</div>
                <input type="file" id="fileInput" accept=".apk" multiple style="display:none">
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div id="apps-section" class="section">
            <div class="github-token-card">
                <div class="github-token-title">
                    <span>GitHub Token</span>
                    <span id="githubTokenStatus" class="github-token-status">检测中...</span>
                </div>
                <p class="github-token-help">
                    Token 用于提高 GitHub 更新检测的请求额度。Token 会加密保存在电视本机，网页不会读取或显示已保存的内容；建议使用无额外权限并设置有效期的 Token。
                </p>
                <div class="github-token-row">
                    <input type="password" id="githubTokenInput" class="url-input" autocomplete="off" placeholder="ghp_... / github_pat_...">
                    <button class="btn btn-primary" onclick="saveGitHubToken()">保存 Token</button>
                    <button id="clearGitHubTokenButton" class="btn btn-secondary" onclick="clearGitHubToken()">清除</button>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="appSearch" class="search-input" placeholder="搜索应用名称或包名..." oninput="filterApps()">
                <button id="systemToggle" class="toggle-btn active" onclick="toggleSystemApps()">隐藏系统应用</button>
            </div>
            <div class="app-grid" id="appGrid">
                <!-- 动态加载 -->
            </div>
        </div>

        <div id="webdav-section" class="section">
            <div class="webdav-card app-card">
                <div class="webdav-title">
                    <span>WebDAV 账户配置</span>
                    <span id="webdavStatusBadge" class="webdav-badge badge-unconfigured">
                        <span class="badge-dot"></span> <span id="webdavStatusText">检测中...</span>
                    </span>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>WebDAV 服务器地址</label>
                        <input type="text" id="wdServerUrl" class="url-input" placeholder="https://dav.jianguoyun.com/dav/">
                    </div>
                    <div class="form-group">
                        <label>远端备份存储目录</label>
                        <input type="text" id="wdRemoteDir" class="url-input" value="/PushTV/Backups/">
                    </div>
                    <div class="form-group">
                        <label>用户名 / 账号</label>
                        <input type="text" id="wdUsername" class="url-input" placeholder="username">
                    </div>
                    <div class="form-group">
                        <label>密码 / 应用授权码</label>
                        <input type="password" id="wdPassword" class="url-input" placeholder="留空保持原密码不变">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="testWebDavConnection()">测试连接</button>
                    <button class="btn btn-primary" onclick="saveWebDavConfig()">保存配置</button>
                </div>
            </div>

            <div id="webdavProgressBanner" style="display: none; margin-bottom: 20px;" class="app-card">
                <div style="padding: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="font-weight: 600;" id="wdProgressMsg">正在备份...</div>
                    <div style="color: var(--primary); font-weight: 700;" id="wdProgressPct">0%</div>
                </div>
            </div>

            <div class="backup-bar">
                <div style="font-weight: 700; font-size: 1.1rem;">可备份第三方应用</div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="toggleSelectAllWdApps()">全选 / 取消全选</button>
                    <button class="btn btn-primary" id="btnWdBackup" onclick="triggerWebDavBackup()">备份所选到云端</button>
                </div>
            </div>
            <div class="app-grid" id="wdAppGrid">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <footer>PushTV - 专注电视端极速体验</footer>

    <script>
        function showSection(id, clickedTab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id + '-section').classList.add('active');
            clickedTab.classList.add('active');
            if(id === 'apps') {
                loadApps();
                loadGitHubTokenConfig();
            }
            if(id === 'webdav') loadWebDavSection();
        }

        // 文件上传逻辑 (保持原样并增强)
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        };

        let dragDepth = 0;
        dropZone.ondragenter = (e) => {
            e.preventDefault();
            dragDepth += 1;
            dropZone.classList.add('dragover');
        };
        dropZone.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            dropZone.classList.add('dragover');
        };
        dropZone.ondragleave = (e) => {
            e.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) dropZone.classList.remove('dragover');
        };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dragDepth = 0;
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.name.toLowerCase().endsWith('.apk')) {
                    addUploadError(file.name, '仅支持 APK 文件');
                } else if (file.size === 0) {
                    addUploadError(file.name, '文件为空，无法上传');
                } else {
                    uploadFile(file);
                }
            });
            fileInput.value = '';
        }

        function createUploadItem(fileName, initialStatus) {
            const id = 'f-' + Math.random().toString(36).slice(2, 11);
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-icon" aria-hidden="true">⇧</div>
                <div class="file-main">
                    <div class="file-heading">
                        <span class="file-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
                        <span class="file-status" id="${id}-status">${escapeHtml(initialStatus)}</span>
                    </div>
                    <div class="progress-track">
                        <div id="${id}-bar" class="progress-bar"></div>
                    </div>
                </div>
            `;
            document.getElementById('fileList').prepend(item);
            return { id, item };
        }

        function addUploadError(fileName, message) {
            const upload = createUploadItem(fileName, message);
            upload.item.classList.add('is-error');
        }

        function uploadFile(file) {
            const { id, item } = createUploadItem(file.name, '准备中');
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');
            xhr.timeout = 10 * 60 * 1000;
            xhr.upload.onprogress = (e) => {
                const status = document.getElementById(id + '-status');
                if (e.lengthComputable && e.total > 0) {
                    const p = Math.min(100, Math.round((e.loaded / e.total) * 100));
                    document.getElementById(id + '-bar').style.width = p + '%';
                    status.innerText = p + '%';
                } else {
                    status.innerText = '上传中';
                }
            };
            xhr.onload = () => {
                const status = document.getElementById(id + '-status');
                let payload = {};
                try { payload = JSON.parse(xhr.responseText); } catch (_) {}
                if (xhr.status >= 200 && xhr.status < 300 && payload.success === true) {
                    status.innerText = '✓ 已送达';
                    item.classList.add('is-complete');
                } else {
                    status.innerText = payload.message || `上传失败 (${xhr.status})`;
                    item.classList.add('is-error');
                }
            };
            xhr.onerror = () => {
                document.getElementById(id + '-status').innerText = '网络连接失败';
                item.classList.add('is-error');
            };
            xhr.onabort = () => {
                document.getElementById(id + '-status').innerText = '上传已取消';
                item.classList.add('is-error');
            };
            xhr.ontimeout = () => {
                document.getElementById(id + '-status').innerText = '上传超时，请重试';
                item.classList.add('is-error');
            };
            const fd = new FormData(); fd.append('file', file);
            xhr.send(fd);
        }

        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = value;
            return node.innerHTML;
        }

        // 应用管理逻辑
        let allApps = [];
        let hideSystem = true;

        async function loadGitHubTokenConfig() {
            const status = document.getElementById('githubTokenStatus');
            try {
                const res = await fetch('/api/github/token');
                const data = await res.json();
                status.innerText = data.configured ? '已配置' : '未配置';
                status.classList.toggle('configured', data.configured === true);
                document.getElementById('githubTokenInput').placeholder = data.configured
                    ? '已配置，输入新 Token 可替换'
                    : 'ghp_... / github_pat_...';
                document.getElementById('clearGitHubTokenButton').disabled = !data.configured;
            } catch (_) {
                status.innerText = '状态读取失败';
                status.classList.remove('configured');
            }
        }

        async function saveGitHubToken() {
            const input = document.getElementById('githubTokenInput');
            const token = input.value.trim();
            if (!token) {
                alert('请输入 GitHub Token');
                input.focus();
                return;
            }
            const fd = new URLSearchParams();
            fd.append('token', token);
            try {
                const res = await fetch('/api/github/token', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok || data.success !== true) throw new Error(data.message || '保存失败');
                input.value = '';
                await loadGitHubTokenConfig();
                alert('GitHub Token 已保存，电视端已同步。');
            } catch (e) {
                alert(e.message || 'GitHub Token 保存失败');
            }
        }

        async function clearGitHubToken() {
            if (!confirm('确定清除电视上保存的 GitHub Token？')) return;
            const fd = new URLSearchParams();
            fd.append('clear', 'true');
            try {
                const res = await fetch('/api/github/token', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok || data.success !== true) throw new Error(data.message || '清除失败');
                document.getElementById('githubTokenInput').value = '';
                await loadGitHubTokenConfig();
                alert('GitHub Token 已清除。');
            } catch (e) {
                alert(e.message || 'GitHub Token 清除失败');
            }
        }

        async function loadApps() {
            const grid = document.getElementById('appGrid');
            if (allApps.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center">正在读取电视上的 App 列表...</div>';
            }
            try {
                const res = await fetch('/api/apps');
                allApps = await res.json();
                filterApps(); // 初始渲染
            } catch(e) { grid.innerHTML = '加载失败，请检查连接'; }
        }

        function toggleSystemApps() {
            hideSystem = !hideSystem;
            const btn = document.getElementById('systemToggle');
            btn.classList.toggle('active', hideSystem);
            btn.innerText = hideSystem ? '隐藏系统应用' : '显示系统应用';
            filterApps();
        }

        function filterApps() {
            const query = document.getElementById('appSearch').value.toLowerCase();
            let filtered = allApps;

            if (hideSystem) {
                filtered = filtered.filter(app => !app.isSystem);
            }

            filtered = filtered.filter(app =>
                app.name.toLowerCase().includes(query) ||
                app.packageName.toLowerCase().includes(query)
            );
            renderApps(filtered);
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            if (apps.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: #64748B; margin-top: 20px;">未找到匹配的应用</div>';
                return;
            }
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-info">
                        <div class="app-name">${app.name}</div>
                        <div class="app-pkg">${app.packageName} (${app.version})</div>
                    </div>
                    <input type="text" class="url-input" id="url-${app.packageName}" value="${app.url || ''}" placeholder="GitHub 项目地址">
                    <button class="save-btn" onclick="saveUrl('${app.packageName}')">同步到电视</button>
                `;
                grid.appendChild(card);
            });
        }

        async function saveUrl(pkg) {
            const url = document.getElementById('url-' + pkg).value;
            const fd = new URLSearchParams();
            fd.append('packageName', pkg);
            fd.append('url', url);
            try {
                const res = await fetch('/api/save_url', { method: 'POST', body: fd });
                const payload = await res.json();
                if (res.ok && payload.success === true) {
                    alert('同步成功！现在可以在电视上点更新了。');
                } else {
                    alert(payload.message || `同步失败 (${res.status})`);
                }
            } catch (_) {
                alert('同步失败，请检查连接');
            }
        }

        // WebDAV 逻辑
        let wdApps = [];
        let wdPollInterval = null;

        async function loadWebDavSection() {
            try {
                const res = await fetch('/api/webdav/config');
                const cfg = await res.json();
                document.getElementById('wdServerUrl').value = cfg.serverUrl || '';
                document.getElementById('wdUsername').value = cfg.username || '';
                document.getElementById('wdPassword').value = cfg.password || '';
                document.getElementById('wdRemoteDir').value = cfg.remoteDir || '/PushTV/Backups/';
                updateWebDavBadge(cfg.status);
            } catch (e) {
                console.error(e);
            }
            loadWebDavApps();
            checkWebDavProgress();
        }

        function updateWebDavBadge(status) {
            const badge = document.getElementById('webdavStatusBadge');
            const text = document.getElementById('webdavStatusText');
            badge.className = 'webdav-badge';
            if (status === 'ONLINE') {
                badge.classList.add('badge-online');
                text.innerText = '在线';
            } else if (status === 'OFFLINE') {
                badge.classList.add('badge-offline');
                text.innerText = '离线 / 错误';
            } else {
                badge.classList.add('badge-unconfigured');
                text.innerText = '未配置';
            }
        }

        async function testWebDavConnection() {
            const url = document.getElementById('wdServerUrl').value;
            const user = document.getElementById('wdUsername').value;
            const pass = document.getElementById('wdPassword').value;
            const dir = document.getElementById('wdRemoteDir').value;

            const fd = new URLSearchParams();
            fd.append('serverUrl', url);
            fd.append('username', user);
            fd.append('password', pass);
            fd.append('remoteDir', dir);

            const text = document.getElementById('webdavStatusText');
            text.innerText = '测试中...';

            try {
                const res = await fetch('/api/webdav/test', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    alert('连接成功！' + data.message);
                    updateWebDavBadge('ONLINE');
                } else {
                    alert('连接失败：' + data.message);
                    updateWebDavBadge('OFFLINE');
                }
            } catch (e) {
                alert('请求异常，请检查网络');
                updateWebDavBadge('OFFLINE');
            }
        }

        async function saveWebDavConfig() {
            const url = document.getElementById('wdServerUrl').value;
            const user = document.getElementById('wdUsername').value;
            const pass = document.getElementById('wdPassword').value;
            const dir = document.getElementById('wdRemoteDir').value;

            const fd = new URLSearchParams();
            fd.append('serverUrl', url);
            fd.append('username', user);
            fd.append('password', pass);
            fd.append('remoteDir', dir);

            try {
                const res = await fetch('/api/webdav/config', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    alert('WebDAV 配置已保存！电视端已即时同步。');
                    loadWebDavSection();
                } else {
                    alert('保存失败');
                }
            } catch (e) {
                alert('保存异常');
            }
        }

        async function loadWebDavApps() {
            const grid = document.getElementById('wdAppGrid');
            try {
                const res = await fetch('/api/apps');
                const apps = await res.json();
                wdApps = apps.filter(app => !app.isSystem);
                renderWebDavApps(wdApps);
            } catch (e) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center">无法读取应用列表</div>';
            }
        }

        function renderWebDavApps(apps) {
            const grid = document.getElementById('wdAppGrid');
            grid.innerHTML = '';
            if (apps.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: #64748B;">没有可备份的第三方应用</div>';
                return;
            }
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-item-select">
                        <input type="checkbox" id="chk-${app.packageName}" value="${app.packageName}">
                        <div>
                            <div class="app-name">${app.name}</div>
                            <div class="app-pkg">${app.packageName} (${app.version})</div>
                        </div>
                    </div>
                `;
                card.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const chk = card.querySelector('input[type="checkbox"]');
                        chk.checked = !chk.checked;
                    }
                };
                grid.appendChild(card);
            });
        }

        function toggleSelectAllWdApps() {
            const checkboxes = document.querySelectorAll('#wdAppGrid input[type="checkbox"]');
            const hasUnchecked = Array.from(checkboxes).some(c => !c.checked);
            checkboxes.forEach(c => c.checked = hasUnchecked);
        }

        async function triggerWebDavBackup() {
            const checked = Array.from(document.querySelectorAll('#wdAppGrid input[type="checkbox"]:checked')).map(c => c.value);
            if (checked.length === 0) {
                alert('请先勾选需要备份的应用');
                return;
            }

            const fd = new URLSearchParams();
            fd.append('packages', checked.join(','));

            try {
                const res = await fetch('/api/webdav/backup', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    alert(`备份任务已在电视后台启动（已加入队列：${data.count} 个应用）`);
                    pollWebDavProgress();
                } else {
                    alert('启动备份失败：' + (data.message || '未知错误'));
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        function checkWebDavProgress() {
            if (wdPollInterval) clearInterval(wdPollInterval);
            pollWebDavProgress();
            wdPollInterval = setInterval(pollWebDavProgress, 2000);
        }

        async function pollWebDavProgress() {
            try {
                const res = await fetch('/api/webdav/progress');
                const data = await res.json();
                const banner = document.getElementById('webdavProgressBanner');
                if (data.active) {
                    banner.style.display = 'block';
                    document.getElementById('wdProgressMsg').innerText = data.statusMessage || '正在传输...';
                    document.getElementById('wdProgressPct').innerText = Math.round((data.progress || 0) * 100) + '%';
                } else {
                    banner.style.display = 'none';
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
